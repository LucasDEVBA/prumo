[project]
name = "prumo"
version = "0.1.0"
description = "Mede a taxa real de acerto de uma IA em produção com poucos rótulos humanos e reverte o prompt sozinho quando a qualidade cai."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Lucas Costa" }]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "numpy>=2.0",
    "boto3>=1.35",
    "mangum>=0.19",
]

[project.optional-dependencies]
# Servidor HTTP local (`prumo serve`). Fica fora das dependências base porque a Lambda roda a API
# pelo Mangum: o bundle não precisa do uvicorn nem das extensões nativas do [standard].
server = ["uvicorn[standard]>=0.30"]

[project.scripts]
prumo = "prumo.cli:main"

[dependency-groups]
dev = [
    # Mesmo pino do extra "server": o `uv sync` de desenvolvimento já deixa o `prumo serve` pronto.
    "uvicorn[standard]>=0.30",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "boto3-stubs[bedrock-runtime,dynamodb,appconfig,appconfigdata,stepfunctions,secretsmanager]>=1.35",
    "moto[dynamodb]>=5.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prumo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: simulações Monte Carlo mais longas (rodam no CI, podem ser puladas localmente com -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"src/prumo/simulation/**" = ["S311"]
"src/prumo/data/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["prumo"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mangum.*"]
ignore_missing_imports = true
